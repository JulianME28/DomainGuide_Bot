[project]
name = "domainguide-bot"
version = "1.0.0"
description = "Telegram-бот для аналізу донорських баз (SEO/linkbuilding)"
requires-python = ">=3.11"

# ---------------------------------------------------------------------------
# ruff — лінтер (шукає помилки в коді) і форматер (вирівнює код)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
# RUF001/002/003 сварилися б на кирилицю в текстах і коментарях — а вона тут навмисна.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# У тестах довгі рядки з даними — це нормально.
"tests/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# pytest — запуск тестів
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"
