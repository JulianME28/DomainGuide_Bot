# ============================================================================
# КАРТА КОЛОНОК — який стовпчик таблиці що означає.
#
# Це єдине місце, де прописано зв'язок «назва колонки в Google Sheets» →
# «сенс для бота». Якщо в таблиці перейменують колонку — правимо ТІЛЬКИ тут,
# код чіпати не треба.
#
# ВАЖЛИВО: колонки країни/гео в даних НЕМАЄ і не планується.
# Країна визначається з доменної зони + мови (див. CLAUDE.md, розділ 3).
# ============================================================================


# ----------------------------------------------------------------------------
# WHITELIST — «білий список» дозволених колонок.
#
# Бот прочитає з таблиці ЛИШЕ ці колонки. Все інше (навіть якщо воно є в
# таблиці) не читається, не потрапляє в пам'ять і не потрапляє в логи.
# Це вимога безпеки: якщо в таблицю колись додадуть комерційно чутливий
# стовпчик — бот його фізично не побачить, поки назву не додадуть сюди.
# ----------------------------------------------------------------------------
[whitelist]
allowed = ["Domain", "Мова", "DR", "Traffic"]


# ----------------------------------------------------------------------------
# РОЗДІЛИ БОТА. Кожен розділ = один аркуш у таблиці.
#
#   title   — як розділ називається для користувача
#   sheet   — точна назва аркуша в Google Sheets (кирилицею!)
#   enabled — чи читаємо цей аркуш узагалі
# ----------------------------------------------------------------------------

# --- Меджик: основна робоча база (~29 000 рядків) ---
[sections.magic]
title = "Меджик"
sheet = "Меджик"
enabled = true

[sections.magic.columns]
domain = "Domain"      # службове поле: потрібне ЛИШЕ щоб дістати доменну зону
language = "Мова"      # англійські назви мов: English, Spanish, Turkish...
dr = "DR"              # може бути "n/a" — тоді донор рахується, але в середнє не йде
traffic = "Traffic"    # може бути "4 800" або "1,200" — парсер це розбирає
# outlinks = "..."     # ← колонки вихідних лінків поки немає в таблиці.
#                        Щойно з'явиться — розкоментувати, додати назву в
#                        whitelist вище, і аналіз заспамленості ввімкнеться сам.

# --- Морди: та сама структура, аркуш поки порожній ---
[sections.mordy]
title = "Морди"
sheet = "Морди"
enabled = true

[sections.mordy.columns]
domain = "Domain"
language = "Мова"
dr = "DR"
traffic = "Traffic"
# outlinks = "..."     # ← те саме: заспамленість вмикається появою цієї колонки

# --- Сабміти: заглушка. Аркуш НЕ читається зовсім. ---
[sections.submits]
title = "Сабміти"
sheet = ""
enabled = false
# Колонок навмисно немає: розділ є в меню, але даних не торкається.
